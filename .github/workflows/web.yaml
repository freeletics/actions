name: "Web and blog Build with Docker Kaniko"

on:
  workflow_call:
    inputs:
      APP_ENV:
        required: false
        type: string
        default: "staging"
      DOCKERFILE:
        required: false
        type: string
        default: "Dockerfile"
      deployment_type:
        required: false
        description: "Used to identify if a deployment was triggered manually or on PR merge"
        type: string
        default: "no-deployment"
      NODE_VERSION:
        required: false
        description: "Node.js version to use"
        type: string
        default: "22.13.1"

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  build:
    timeout-minutes: ${{ fromJSON(vars.WEB_JOB_TIMEOUT || vars.DEFAULT_JOB_TIMEOUT) }}
    env:
      APP_ENV: "${{ contains(github.ref, 'refs/tags/') && 'production' || inputs.APP_ENV }}"
    outputs:
      IMAGE_TAG: ${{ steps.IMAGE_TAG.outputs.IMAGE_TAG }}
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          concurrent_skipping: "same_content"
          cancel_others: "true"

      - name: Check out code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.NODE_VERSION }}"

      - name: Login to NPM
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: "Cache node modules"
        if: github.event.repository.name == 'web-service-main'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            public
            .cache
          key: ${{ runner.os }}-${{ env.APP_ENV }}-build-${{ github.event.repository.name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ env.APP_ENV }}-build-${{ github.event.repository.name }}-

      - name: "Install deps"
        run: pnpm install --frozen-lockfile

      - name: Check EBANX key
        id: ebanx_key
        if: github.event.repository.name == 'web-service-main'
        env:
          INTEGRATION_KEY: ${{ secrets.EBANX_INTEGRATION_KEY }}
        run: |
          if [ -n "$INTEGRATION_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EBANX_INTEGRATION_KEY is empty or not set — skipping EBANX fetch and bundle"
          fi

      - name: Download & convert EBANX BIN data
        if: steps.ebanx_key.outputs.present == 'true'
        env:
          INTEGRATION_KEY: ${{ secrets.EBANX_INTEGRATION_KEY }}
        run: |
          cd apps/web-main/config/ebanx
          for c in AR CL CO MX PE; do
            curl -fsS -o "cardbin-$c.json" \
              "https://api.ebanx.com/ws/cardbin/?integration_key=$INTEGRATION_KEY&country=$c"
          done
          cd ../../../..
          pnpm convertebanx

      - name: Build
        run: pnpm build -- --mode $APP_ENV
        env:
          NODE_ENV: "production"
          CI: false
          APP_ENV: "${{ env.APP_ENV }}"
          GATSBY_APP_ENV: "${{ env.APP_ENV }}"

      - name: Bundle EBANX data into build output
        if: steps.ebanx_key.outputs.present == 'true'
        run: |
          mkdir -p apps/web-main/dist/ebanx
          cp -R apps/web-main/config/ebanx/converted/. apps/web-main/dist/ebanx/

      - name: "[WEB] Compress Artifacts"
        if: github.event.repository.name == 'web-service-main'
        run: |
          tar -czf public.tar.gz apps/web-main/dist

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: |
            public.tar.gz
          retention-days: 5
