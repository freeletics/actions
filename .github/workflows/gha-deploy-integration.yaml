name: "Deploy integration"

on:
  workflow_call:
    inputs:
      BUILD_ARGS:
        type: string
        required: false
      ARTIFACTS_NAME:
        type: string
        required: false
      ARTIFACTS_COMPRESSED:
        type: boolean
        required: false
        default: false
      DOCKERFILE:
        type: string
        required: false
        default: "Dockerfile"
      AWS_ECR_ENV_NAME:
        required: false
        type: string
        default: "prod"
      AWS_REGION:
        required: true
        type: string
      AWS_ACCOUNT_ID:
        required: true
        type: string
      KANIKO_CACHE:
        required: false
        type: boolean
        default: true
      SLACK_NOTIFY:
        description: >-
          Announce the deploy in Slack. Integration is shared, so this is on by
          default: turn it off only for services nobody else tests against.
        required: false
        type: boolean
        default: true
      SLACK_TARGET:
        description: >-
          Which channel to announce in. `auto` derives it from fl-bolt's
          ghaMapping (WEB* services go to the web channel, everything else to
          backend); `backend` / `web` force it, `none` is the same as
          SLACK_NOTIFY: false.
        required: false
        type: string
        default: "auto"
    secrets:
      # All callers use `secrets: inherit`, so these are declared purely to
      # document what this workflow reaches for. Each one degrades to a warning
      # when unset -- the deploy itself never depends on them.
      SLACK_CIR_BACKEND_HOOK:
        required: false
      SLACK_CIR_WEB_HOOK:
        required: false
      JENKINS_PAT_FLUXCD:
        required: false

permissions:
  id-token: write
  contents: read
  actions: write
  deployments: write

jobs:
  build:
    timeout-minutes: ${{ fromJSON(vars.BE_JOB_TIMEOUT || vars.DEFAULT_JOB_TIMEOUT) }}
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub context   
        env: 
          GITHUB_CONTEXT: ${{ toJson(github) }}   
        run: echo "$GITHUB_CONTEXT"
        shell: bash
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: "same_content"
          cancel_others: "true"

      - name: Check out code
        uses: actions/checkout@v7

      - name: Download artifacts
        if: ${{ inputs.ARTIFACTS_NAME != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.ARTIFACTS_NAME }}
          path: ${{ github.workspace }}/${{ inputs.ARTIFACTS_NAME }}

      # `tar -xf` auto-detects the compression format, so this handles
      # `.tar.gz` (every caller today) and `.tar.zst` (web-astro, PE-48093)
      # without naming either.
      - name: Uncompress Artifacts
        if: ${{ inputs.ARTIFACTS_COMPRESSED == true }}
        env:
          DIR: ${{ github.workspace }}/${{ inputs.ARTIFACTS_NAME }}
          NAME: ${{ inputs.ARTIFACTS_NAME }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ARCHIVE=$(find "$DIR" -maxdepth 1 -name "$NAME.tar.*" -print -quit)
          [ -n "$ARCHIVE" ] || { echo "::error::No $NAME.tar.* in $DIR"; ls -la "$DIR"; exit 1; }
          tar -xf "$ARCHIVE" -C "$WORKSPACE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ inputs.AWS_ACCOUNT_ID }}:role/github-actions/fl-${{ inputs.AWS_ECR_ENV_NAME }}-${{ github.event.repository.name }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Login to Amazon ECR Private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Get Today's Unix timestamp
        id: timestamp
        run: echo "date=$(date +'%s')" >> $GITHUB_OUTPUT

        # for tag we use gha-prod
      - uses: docker/metadata-action@v6.2.0
        name: Generate tags
        id: metadata
        with:
          images: ${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com/${{ github.event.repository.name }}
          tags: |
            type=sha,enable=true,priority=600,prefix=gha-,suffix=
            type=raw,enable=true,priority=600,prefix=gha-deploy-int-,value=${{ steps.timestamp.outputs.date }}

      - name: Set GeoLite2 cache key
        id: geoip-cache
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and use a new builder instance
        run: |
          docker buildx create --name builder --use

      - name: Build and push
        timeout-minutes: 8
        continue-on-error: true
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "${{ inputs.DOCKERFILE }}"
          build-args: |
            ${{ inputs.BUILD_ARGS }}
            GEOLITE2_CACHE_BUST=${{ steps.geoip-cache.outputs.date }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          builder: builder
          cache-from: type=registry,ref=${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com/kaniko-cache:${{ github.event.repository.name }}
          cache-to: type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com/kaniko-cache:${{ github.event.repository.name }}

      - name: Build and push (retry after stalled pull)
        if: steps.build.outcome == 'failure'
        timeout-minutes: 8
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "${{ inputs.DOCKERFILE }}"
          build-args: |
            ${{ inputs.BUILD_ARGS }}
            GEOLITE2_CACHE_BUST=${{ steps.geoip-cache.outputs.date }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          builder: builder
          cache-from: type=registry,ref=${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{
            inputs.AWS_REGION }}.amazonaws.com/kaniko-cache:${{
            github.event.repository.name }}
          cache-to: type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
            inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION
            }}.amazonaws.com/kaniko-cache:${{ github.event.repository.name }}


      # Integration is shared: a custom branch parked on it quietly invalidates
      # whatever everyone else is testing. Announce who took it, for which
      # service, and what is in the branch.
      #
      # Deliberately after the push rather than before the build: an image that
      # never built is not a deploy, and a false alarm in this channel trains
      # people to ignore it. Deliberately continue-on-error: a Slack outage must
      # never be the reason a deploy is marked failed.
      #
      # Service names and Slack handles come from freeletics/fl-bolt at run time
      # -- see the action for why, and add new services/people there, not here.
      - name: Announce deploy in Slack
        if: ${{ inputs.SLACK_NOTIFY }}
        continue-on-error: true
        uses: freeletics/actions/.github/actions/slack-deploy-notify@main
        with:
          github_token: ${{ secrets.JENKINS_PAT_FLUXCD }}
          slack_webhook_backend: ${{ secrets.SLACK_CIR_BACKEND_HOOK }}
          slack_webhook_web: ${{ secrets.SLACK_CIR_WEB_HOOK }}
          environment: Integration
          target: ${{ inputs.SLACK_TARGET }}

      # we will not activate GH deployment creation for a custom branch deployment for now
      - uses: chrnorm/deployment-action@v2
        name: Create GitHub deployment
        id: deployment
        if: github.ref == 'refs/heads/master'
        with:
          token: '${{ github.token }}'
          environment: integration
          initial-status: in_progress
          payload: "{\"docker_image_tag\":\"gha-deploy-int-${{ steps.timestamp.outputs.date }}\",\"deployed_by\":\"${{github.actor}}\"}"
          
      - name: Update deployment status (in_progress)
        uses: chrnorm/deployment-status@v2
        if: github.ref == 'refs/heads/master'
        with:
          token: '${{ github.token }}'
          environment-url: http://my-app-url.com
          state: 'in_progress'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

