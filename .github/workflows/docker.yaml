name: "Docker Build with Kaniko"

on:
  workflow_call:
    inputs:
      BUILD_ARGS:
        type: string
        required: false
      ARTIFACTS_NAME:
        type: string
        required: false
      ARTIFACTS_COMPRESSED:
        type: boolean
        required: false
        default: false
      DOCKERFILE:
        type: string
        required: false
        default: "Dockerfile"
      env_name:
        type: string
        required: false
      AWS_ECR_ENV_NAME:
        required: false
        type: string
        default: "prod"
      AWS_REGION:
        required: true
        type: string
      AWS_ACCOUNT_ID:
        required: true
        type: string
      KANIKO_CACHE:
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  build:
    timeout-minutes: ${{ fromJSON(vars.BE_JOB_TIMEOUT || vars.DEFAULT_JOB_TIMEOUT) }}
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: "same_content"
          cancel_others: "true"

      - name: Check out code
        uses: actions/checkout@v7

      - name: Download artifacts
        if: ${{ inputs.ARTIFACTS_NAME != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.ARTIFACTS_NAME }}
          path: ${{ github.workspace }}/${{ inputs.ARTIFACTS_NAME }}

      # Accepts either `.tar.zst` or `.tar.gz`, picking whichever the
      # producing workflow actually uploaded. Detection rather than a
      # swap, because this workflow is shared by 16 repos and every
      # existing caller uploads gzip — they keep working untouched.
      # zstd is preinstalled on the GitHub-hosted ubuntu images.
      - name: Uncompress Artifacts
        if: ${{ inputs.ARTIFACTS_COMPRESSED == true }}
        run: |
          set -euo pipefail
          DIR="${{ github.workspace }}/${{ inputs.ARTIFACTS_NAME }}"
          NAME="${{ inputs.ARTIFACTS_NAME }}"
          if [ -f "$DIR/$NAME.tar.zst" ]; then
            echo "Extracting $NAME.tar.zst (zstd)"
            zstd -dc "$DIR/$NAME.tar.zst" | tar -xf - -C "${{ github.workspace }}"
          elif [ -f "$DIR/$NAME.tar.gz" ]; then
            echo "Extracting $NAME.tar.gz (gzip)"
            tar -xzf "$DIR/$NAME.tar.gz" -C "${{ github.workspace }}"
          else
            echo "::error::No $NAME.tar.zst or $NAME.tar.gz found in $DIR"
            ls -la "$DIR" || true
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ inputs.AWS_ACCOUNT_ID
            }}:role/github-actions/fl-${{ inputs.AWS_ECR_ENV_NAME }}-${{
            github.event.repository.name }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Login to Amazon ECR Private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
        # for tag we use gha-prod
        # for intgration get a new image tag with date of today; then a webhook will notify Flux of changes
      - uses: docker/metadata-action@v6.2.0
        name: Generate tags
        id: metadata
        with:
          images: ${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION
            }}.amazonaws.com/${{ github.event.repository.name }}
          tags: |
            type=sha,enable=true,priority=600,prefix=gha-,suffix=
            type=ref,enable=true,priority=600,prefix=gha-latest-,suffix=,event=branch
            type=ref,enable=true,priority=600,prefix=,suffix=,event=tag
            type=ref,enable=true,priority=600,prefix=gha-,suffix=,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and use a new builder instance
        run: |
          docker buildx create --name builder --use

      - name: Set GeoLite2 cache key
        id: geoip-cache
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "${{ inputs.DOCKERFILE }}"
          build-args: |
            ${{ inputs.BUILD_ARGS }}
            GEOLITE2_CACHE_BUST=${{ steps.geoip-cache.outputs.date }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          builder: builder
          cache-from: type=registry,ref=${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{
            inputs.AWS_REGION }}.amazonaws.com/kaniko-cache:${{
            github.event.repository.name }}
          cache-to: type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
            inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION
            }}.amazonaws.com/kaniko-cache:${{ github.event.repository.name }}
